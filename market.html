<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CODEV2E Market | Official Studio Merch & Digital Stories</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f0;
      --text: #111113;
      --text-muted: #5a5a64;
      --font-display: 'Syne', 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding-bottom: 80px; }
    .container { width: min(1200px, calc(100% - 40px)); margin: 0 auto; }
    
    .nav-bar { padding: 20px 0; border-bottom: 2px solid #111; margin-bottom: 50px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-family: var(--font-display); font-size: 24px; font-weight: 900; }
    
    .market-hero { text-align: center; margin-bottom: 60px; }
    .market-hero h1 { font-family: var(--font-display); font-size: clamp(42px, 7vw, 92px); font-weight: 900; letter-spacing: -3px; }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }
    .product-card { border: 2.5px solid #111; background: #fff; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .product-img { aspect-ratio: 1/1; background: #000; overflow: hidden; border-bottom: 2px solid #111; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; gap: 8px; }
    .product-price { font-family: var(--font-display); font-size: 22px; font-weight: 900; margin-top: auto; padding-top: 10px; }
    
    .buy-btn { background: #111; color: #fff; border: 2px solid #111; padding: 12px; font-weight: 900; font-size: 11px; letter-spacing: 1.5px; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
    .buy-btn:hover { background: #000; }

    /* ORDER MODAL */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; place-items: center; padding: 20px; z-index: 9999; }
    .modal.open { display: grid; }
    .modal-box { width: min(500px, 94vw); background: #fff; border: 3px solid #111; border-radius: 8px; padding: 36px; position: relative; }
    input, textarea { width: 100%; padding: 12px; border: 2px solid #111; margin-bottom: 12px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="container">
    <header class="nav-bar">
      <a href="index.html" class="brand">CODE<span>V2E</span> // STORE</a>
      <a href="index.html" style="font-weight: 800; font-size: 11px; text-decoration: underline;">← BACK TO STUDIO SHOWLIST</a>
    </header>

    <div class="market-hero">
      <p style="font-size: 10px; font-weight: 800; letter-spacing: 3px; color: #888;">OFFICIAL MERCHANDISE & DIGITAL ART</p>
      <h1>STUDIO MARKET</h1>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div class="modal" id="orderModal">
    <div class="modal-box">
      <button onclick="document.getElementById('orderModal').classList.remove('open')" style="position: absolute; top: 12px; right: 14px; font-size: 24px; background: transparent; border: 0; cursor: pointer;">×</button>
      <h2 id="orderTitle" style="font-family: var(--font-display); font-size: 24px; margin-bottom: 14px;">CHECKOUT</h2>
      <form action="https://formspree.io/f/xlgoawrl" method="POST">
        <input type="hidden" name="Product" id="orderProductInput">
        <label style="font-size: 9px; font-weight: 800;">YOUR NAME</label>
        <input type="text" name="Name" required>
        <label style="font-size: 9px; font-weight: 800;">EMAIL ADDRESS</label>
        <input type="email" name="Email" required>
        <label style="font-size: 9px; font-weight: 800;">SHIPPING ADDRESS / INQUIRY DETAILS</label>
        <textarea name="Address" rows="3" required></textarea>
        <button type="submit" class="buy-btn" style="width: 100%;">CONFIRM & SEND ORDER INQUIRY</button>
      </form>
    </div>
  </div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('./data.json?v=' + Date.now());
        const data = await res.json();
        const grid = document.getElementById("productGrid");
        if (data.products && data.products.length) {
          grid.innerHTML = data.products.map(p => `
            <div class="product-card">
              <div class="product-img">
                <img src="${p.image || 'images/logo.png'}" alt="${p.title}">
              </div>
              <div class="product-body">
                <small style="font-size: 8px; font-weight: 800; color: #888;">${p.category || 'MERCH'}</small>
                <h3 style="font-family: var(--font-display); font-size: 20px;">${p.title}</h3>
                <p style="color: #666; font-size: 13px;">${p.description || ''}</p>
                <div class="product-price">${p.price || '$0.00'}</div>
                <button class="buy-btn" onclick="openOrder('${p.title}')">ORDER NOW</button>
              </div>
            </div>
          `).join("");
        }
      } catch (err) {}
    }
    function openOrder(title) {
      document.getElementById("orderTitle").textContent = `ORDER: ${title}`;
      document.getElementById("orderProductInput").value = title;
      document.getElementById("orderModal").classList.add("open");
    }
    loadProducts();
  </script>
</body>
</html>
