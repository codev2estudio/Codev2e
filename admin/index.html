<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEV2E Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #fff;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      border: 1px solid #ddd;
      background: #fff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .brand span {
      font-weight: 400;
    }

    .login-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d8d8d8;
      background: #fff;
      color: #111;
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
      transition: .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(0,0,0,.06);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .field {
      margin-bottom: 17px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 800;
      transition: .2s;
    }

    .btn-black {
      width: 100%;
      background: #111;
      color: #fff;
    }

    .btn-black:hover {
      background: #333;
    }

    .error {
      color: #c00;
      font-size: 13px;
      margin-top: 12px;
    }

    /* APP */

    #app {
      min-height: 100vh;
    }

    header {
      height: 70px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-brand {
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .logout {
      background: #fff;
      border: 1px solid #ccc;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .layout {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .hero-title {
      margin-bottom: 25px;
    }

    .hero-title h1 {
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: -2px;
    }

    .hero-title p {
      color: #666;
      margin-top: 7px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 25px;
    }

    .tab {
      flex: 0 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 800;
    }

    .tab.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      font-size: 20px;
    }

    .btn-small {
      background: #111;
      color: #fff;
      padding: 9px 13px;
      border-radius: 9px;
      border: 0;
      cursor: pointer;
      font-weight: 800;
    }

    .project-list {
      display: grid;
      gap: 12px;
    }

    .project {
      border: 1px solid #e1e1e1;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .project h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .project p {
      color: #777;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .edit {
      border: 1px solid #ccc;
      background: #fff;
      padding: 8px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .delete {
      border: 1px solid #e2bcbc;
      background: #fff;
      color: #b00000;
      padding: 8px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .empty {
      padding: 35px 10px;
      text-align: center;
      color: #777;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 100;
    }

    .modal-box {
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .close {
      border: 0;
      background: #eee;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .form-actions button {
      flex: 1;
    }

    .btn-cancel {
      background: #eee;
      color: #111;
    }

    .status {
      margin-bottom: 18px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.ok {
      background: #e9f8ed;
      color: #176b2b;
    }

    .status.bad {
      background: #fdeaea;
      color: #a00000;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 15px;
      }

      .layout {
        padding: 22px 12px 45px;
      }

      .panel {
        padding: 15px;
      }

      .project {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .login-box {
        padding: 24px 19px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen">
    <div class="login-box">
      <div class="brand">CODE<span>V2E</span></div>
      <p class="login-subtitle">Private administration panel</p>

      <form id="loginForm">
        <div class="field">
          <label for="password">Admin password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >
        </div>

        <button class="btn btn-black" type="submit">
          Sign in
        </button>

        <p id="loginError" class="error"></p>
      </form>
    </div>
  </section>


  <!-- ADMIN APP -->
  <section id="app" class="hidden">

    <header>
      <div class="header-brand">CODEV2E ADMIN</div>
      <button id="logoutBtn" class="logout">Logout</button>
    </header>

    <main class="layout">

      <div class="hero-title">
        <h1>Dashboard</h1>
        <p>Manage your CODEV2E website.</p>
      </div>

      <div id="status" class="status"></div>

      <nav class="tabs">
        <button class="tab active" data-tab="projects">
          Projects
        </button>

        <button class="tab" data-tab="announcements">
          Announcements
        </button>
      </nav>


      <!-- PROJECTS -->
      <section id="projectsPanel" class="panel">

        <div class="panel-header">
          <h2>Projects</h2>

          <button id="addProjectBtn" class="btn-small">
            + Add project
          </button>
        </div>

        <div id="projectList" class="project-list">
          <div class="empty">
            Loading projects...
          </div>
        </div>

      </section>


      <!-- ANNOUNCEMENTS -->
      <section id="announcementsPanel" class="panel hidden">

        <div class="panel-header">
          <h2>Announcements</h2>

          <button id="addAnnouncementBtn" class="btn-small">
            + Add announcement
          </button>
        </div>

        <div id="announcementList" class="project-list">
          <div class="empty">
            Loading announcements...
          </div>
        </div>

      </section>

    </main>
  </section>


  <!-- PROJECT MODAL -->
  <div id="projectModal" class="modal hidden">

    <div class="modal-box">

      <div class="modal-header">
        <h2 id="projectModalTitle">Add project</h2>

        <button class="close" data-close="projectModal">
          ×
        </button>
      </div>

      <form id="projectForm">

        <input type="hidden" id="projectId">

        <div class="field">
          <label for="projectTitle">Title</label>
          <input id="projectTitle" required>
        </div>

        <div class="field">
          <label for="projectDescription">Description</label>
          <textarea id="projectDescription"></textarea>
        </div>

        <div class="field">
          <label for="projectImage">Image URL</label>
          <input
            id="projectImage"
            type="url"
            placeholder="https://..."
          >
        </div>

        <div class="field">
          <label for="projectLink">Project URL</label>
          <input
            id="projectLink"
            type="url"
            placeholder="https://..."
          >
        </div>

        <div class="field">
          <label for="projectStatus">Status</label>

          <select id="projectStatus">
            <option value="released">Released</option>
            <option value="upcoming">Upcoming</option>
          </select>
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn btn-cancel"
            data-close="projectModal"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-black"
          >
            Save project
          </button>
        </div>

      </form>

    </div>
  </div>


  <!-- ANNOUNCEMENT MODAL -->
  <div id="announcementModal" class="modal hidden">

    <div class="modal-box">

      <div class="modal-header">
        <h2 id="announcementModalTitle">
          Add announcement
        </h2>

        <button class="close" data-close="announcementModal">
          ×
        </button>
      </div>

      <form id="announcementForm">

        <input type="hidden" id="announcementId">

        <div class="field">
          <label for="announcementTitle">Title</label>
          <input id="announcementTitle" required>
        </div>

        <div class="field">
          <label for="announcementContent">Content</label>
          <textarea id="announcementContent" required></textarea>
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn btn-cancel"
            data-close="announcementModal"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-black"
          >
            Save announcement
          </button>
        </div>

      </form>

    </div>
  </div>


<script>
  const API = "/api";

  const loginScreen = document.getElementById("loginScreen");
  const app = document.getElementById("app");

  const loginForm = document.getElementById("loginForm");
  const passwordInput = document.getElementById("password");
  const loginError = document.getElementById("loginError");

  const statusBox = document.getElementById("status");

  const projectList = document.getElementById("projectList");
  const announcementList = document.getElementById("announcementList");

  const projectModal = document.getElementById("projectModal");
  const announcementModal = document.getElementById("announcementModal");

  let projects = [];
  let announcements = [];


  function showStatus(message, type = "ok") {
    statusBox.textContent = message;
    statusBox.className = "status show " + type;

    setTimeout(() => {
      statusBox.className = "status";
    }, 3500);
  }


  async function request(url, options = {}) {
    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    let data = {};

    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    return data;
  }


  async function checkSession() {
    try {
      await request(API + "/me");

      loginScreen.classList.add("hidden");
      app.classList.remove("hidden");

      loadProjects();
      loadAnnouncements();

    } catch {
      loginScreen.classList.remove("hidden");
      app.classList.add("hidden");
    }
  }


  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginError.textContent = "";

    try {
      await request(API + "/login", {
        method: "POST",
        body: JSON.stringify({
          password: passwordInput.value
        })
      });

      passwordInput.value = "";

      loginScreen.classList.add("hidden");
      app.classList.remove("hidden");

      loadProjects();
      loadAnnouncements();

    } catch (error) {
      loginError.textContent =
        error.message || "Login failed";
    }
  });


  document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

      try {
        await request(API + "/logout", {
          method: "POST"
        });
      } catch {}

      app.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      passwordInput.value = "";
    });


  /* TABS */

  document.querySelectorAll(".tab").forEach(tab => {

    tab.addEventListener("click", () => {

      document.querySelectorAll(".tab")
        .forEach(item => item.classList.remove("active"));

      tab.classList.add("active");

      const selected = tab.dataset.tab;

      document
        .getElementById("projectsPanel")
        .classList.toggle(
          "hidden",
          selected !== "projects"
        );

      document
        .getElementById("announcementsPanel")
        .classList.toggle(
          "hidden",
          selected !== "announcements"
        );
    });

  });


  /* PROJECTS */

  async function loadProjects() {

    projectList.innerHTML =
      '<div class="empty">Loading projects...</div>';

    try {

      const data = await request(API + "/projects");

      projects = Array.isArray(data)
        ? data
        : (data.projects || []);

      renderProjects();

    } catch (error) {

      projectList.innerHTML =
        '<div class="empty">Unable to load projects.</div>';

      showStatus(error.message, "bad");
    }
  }


  function renderProjects() {

    if (!projects.length) {

      projectList.innerHTML =
        '<div class="empty">No projects yet.</div>';

      return;
    }

    projectList.innerHTML = projects.map(project => {

      const title =
        escapeHTML(project.title || "Untitled");

      const description =
        escapeHTML(project.description || "");

      return `
        <article class="project">

          <div>
            <h3>${title}</h3>
            <p>${description}</p>
          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="editProject('${escapeAttr(project.id)}')"
            >
              Edit
            </button>

            <button
              class="delete"
              onclick="deleteProject('${escapeAttr(project.id)}')"
            >
              Delete
            </button>

          </div>

        </article>
      `;

    }).join("");
  }


  document.getElementById("addProjectBtn")
    .addEventListener("click", () => {

      document.getElementById("projectForm").reset();

      document.getElementById("projectId").value = "";

      document.getElementById("projectModalTitle").textContent =
        "Add project";

      projectModal.classList.remove("hidden");
    });


  window.editProject = function(id) {

    const project = projects.find(
      item => String(item.id) === String(id)
    );

    if (!project) return;

    document.getElementById("projectId").value =
      project.id || "";

    document.getElementById("projectTitle").value =
      project.title || "";

    document.getElementById("projectDescription").value =
      project.description || "";

    document.getElementById("projectImage").value =
      project.image_url ||
      project.image ||
      "";

    document.getElementById("projectLink").value =
      project.link ||
      project.url ||
      "";

    document.getElementById("projectStatus").value =
      project.status || "upcoming";

    document.getElementById("projectModalTitle").textContent =
      "Edit project";

    projectModal.classList.remove("hidden");
  };


  document.getElementById("projectForm")
    .addEventListener("submit", async event => {

      event.preventDefault();

      const id =
        document.getElementById("projectId").value;

      const payload = {
        title:
          document.getElementById("projectTitle").value.trim(),

        description:
          document.getElementById("projectDescription").value.trim(),

        image_url:
          document.getElementById("projectImage").value.trim(),

        link:
          document.getElementById("projectLink").value.trim(),

        status:
          document.getElementById("projectStatus").value
      };

      try {

        if (id) {

          await request(
            API + "/projects/" + encodeURIComponent(id),
            {
              method: "PUT",
              body: JSON.stringify(payload)
            }
          );

          showStatus("Project updated.");

        } else {

          await request(API + "/projects", {
            method: "POST",
            body: JSON.stringify(payload)
          });

          showStatus("Project added.");
        }

        projectModal.classList.add("hidden");

        await loadProjects();

      } catch (error) {

        showStatus(error.message, "bad");
      }
    });


  window.deleteProject = async function(id) {

    if (!confirm("Delete this project?")) return;

    try {

      await request(
        API + "/projects/" + encodeURIComponent(id),
        {
          method: "DELETE"
        }
      );

      showStatus("Project deleted.");

      loadProjects();

    } catch (error) {

      showStatus(error.message, "bad");
    }
  };


  /* ANNOUNCEMENTS */

  async function loadAnnouncements() {

    announcementList.innerHTML =
      '<div class="empty">Loading announcements...</div>';

    try {

      const data =
        await request(API + "/announcements");

      announcements = Array.isArray(data)
        ? data
        : (data.announcements || []);

      renderAnnouncements();

    } catch (error) {

      announcementList.innerHTML =
        '<div class="empty">Unable to load announcements.</div>';

      showStatus(error.message, "bad");
    }
  }


  function renderAnnouncements() {

    if (!announcements.length) {

      announcementList.innerHTML =
        '<div class="empty">No announcements yet.</div>';

      return;
    }

    announcementList.innerHTML =
      announcements.map(item => {
