<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CODEV2E · Command Engine</title>
  <link rel="icon" href="images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f0;
      --text: #111113;
      --surface: #ffffff;
      --line: rgba(0,0,0,0.12);
      --font-display: 'Syne', 'Space Grotesk', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 100px; }
    .container { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
    .auth-box { max-width: 440px; margin: 100px auto; padding: 36px; background: #fff; border: 3px solid #111; border-radius: 8px; }
    
    .top-bar { position: sticky; top: 0; background: rgba(245,245,240,0.92); backdrop-filter: blur(16px); border-bottom: 2px solid #111; padding: 16px 0; margin-bottom: 30px; z-index: 100; }
    .top-bar-inner { display: flex; justify-content: space-between; align-items: center; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 30px; border-bottom: 2px solid #111; padding-bottom: 12px; overflow-x: auto; }
    .tab-btn { padding: 10px 16px; background: transparent; border: 2px solid transparent; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
    .tab-btn.active { background: #111; color: #fff; border-color: #111; }

    .panel { background: #fff; border: 2.5px solid #111; padding: 28px; border-radius: 8px; }
    .card-item { border: 2px solid var(--line); padding: 20px; margin-bottom: 20px; border-radius: 6px; background: #fafaf8; }
    
    input, textarea, select { width: 100%; padding: 12px; background: #fff; border: 1.5px solid #111; margin-bottom: 10px; font-family: inherit; font-size: 13px; border-radius: 4px; }
    label { font-size: 8px; font-weight: 800; letter-spacing: 1.5px; color: #666; text-transform: uppercase; margin-bottom: 4px; display: block; }
    
    .btn { padding: 10px 20px; background: #111; color: #fff; border: 2px solid #111; font-size: 10px; font-weight: 800; cursor: pointer; border-radius: 4px; text-transform: uppercase; }
    .btn-outline { background: #fff; color: #111; }
    .btn-danger { background: transparent; border-color: #dc2626; color: #dc2626; }
    .btn-danger:hover { background: #dc2626; color: #fff; }
  </style>
</head>
<body>

  <div class="auth-box" id="authView">
    <h1 style="font-family: var(--font-display); font-size: 32px; margin-bottom: 14px;">COMMAND LOGIN</h1>
    <form id="loginForm">
      <label>GITHUB USERNAME</label>
      <input type="text" id="repoOwner" placeholder="e.g. codev2estudio" required>
      <label>REPOSITORY NAME</label>
      <input type="text" id="repoName" placeholder="e.g. Codev2e" required>
      <label>ACCESS TOKEN (PAT)</label>
      <input type="password" id="ghToken" placeholder="github_pat_..." required>
      <button type="submit" class="btn" style="width: 100%;">AUTHENTICATE</button>
    </form>
    <div id="authStatus" style="color: #dc2626; font-size: 11px; margin-top: 10px;"></div>
  </div>

  <div id="dashView" style="display: none;">
    <header class="top-bar">
      <div class="container top-bar-inner">
        <div style="font-family: var(--font-display); font-weight: 900; font-size: 18px;">CODE<span>V2E</span> COMMAND</div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-outline" id="saveBtn">PUBLISH TO LIVE SITE</button>
          <button class="btn btn-danger" onclick="sessionStorage.clear(); location.reload();">LOGOUT</button>
        </div>
      </div>
    </header>

    <main class="container">
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="tab-hero">01. MOVIE WIDGET</button>
        <button class="tab-btn" data-tab="tab-ott">02. OTT PROJECTS</button>
        <button class="tab-btn" data-tab="tab-chars">03. CHARACTERS</button>
        <button class="tab-btn" data-tab="tab-market">04. MARKET ITEMS</button>
        <button class="tab-btn" data-tab="tab-news">05. NEWS</button>
      </nav>

      <!-- TAB 1: HERO MOVIE WIDGET -->
      <section id="tab-hero" class="tab-content">
        <div class="panel">
          <h2 style="font-family: var(--font-display); margin-bottom: 20px;">TOP MOVIE BANNER (IMAGE 2 WIDGET)</h2>
          <label>MOVIE TITLE</label>
          <input type="text" id="hwTitle" oninput="state.heroWidget.title=this.value">
          <label>MOVIE DESCRIPTION</label>
          <textarea id="hwDesc" rows="3" oninput="state.heroWidget.description=this.value"></textarea>
          <label>BANNER IMAGE PATH OR URL</label>
          <input type="text" id="hwImg" oninput="state.heroWidget.image=this.value">
          <input type="file" id="hwFile" style="display:none;" onchange="uploadFile(this.files[0], (path)=>{ state.heroWidget.image=path; document.getElementById('hwImg').value=path; })">
          <button class="btn btn-outline" onclick="document.getElementById('hwFile').click()">⬆ UPLOAD BANNER FROM DEVICE</button>
        </div>
      </section>

      <!-- TAB 2: OTT PROJECTS -->
      <section id="tab-ott" class="tab-content" style="display: none;">
        <div class="panel">
          <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="font-family: var(--font-display);">SHOWLIST OTT PRODUCTIONS</h2>
            <button class="btn btn-outline" id="addProjBtn">+ ADD PROJECT</button>
          </div>
          <div id="projList"></div>
        </div>
      </section>

      <!-- TAB 3: CHARACTERS -->
      <section id="tab-chars" class="tab-content" style="display: none;">
        <div class="panel">
          <h2 style="font-family: var(--font-display); margin-bottom: 20px;">ROSTER (5 CORE CHARACTERS)</h2>
          <div id="charList"></div>
        </div>
      </section>

      <!-- TAB 4: MARKET -->
      <section id="tab-market" class="tab-content" style="display: none;">
        <div class="panel">
          <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="font-family: var(--font-display);">MARKET STORE PRODUCTS</h2>
            <button class="btn btn-outline" id="addProdBtn">+ ADD PRODUCT</button>
          </div>
          <div id="prodList"></div>
        </div>
      </section>

      <!-- TAB 5: NEWS -->
      <section id="tab-news" class="tab-content" style="display: none;">
        <div class="panel">
          <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="font-family: var(--font-display);">STUDIO NEWS & DISPATCHES</h2>
            <button class="btn btn-outline" id="addNewsBtn">+ ADD NEWS</button>
          </div>
          <div id="newsList"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let state = { heroWidget: {}, projects: [], characters: [], products: [], announcements: [] };
    let fileSha = "";

    function init() {
      const owner = sessionStorage.getItem("codev2e_gh_owner");
      const repo = sessionStorage.getItem("codev2e_gh_repo");
      const token = sessionStorage.getItem("codev2e_gh_token");
      if (owner && repo && token) loadRepo(owner, repo, token);
    }

    document.getElementById("loginForm").onsubmit = async e => {
      e.preventDefault();
      const owner = document.getElementById("repoOwner").value.trim();
      const repo = document.getElementById("repoName").value.trim();
      const token = document.getElementById("ghToken").value.trim();
      if (await loadRepo(owner, repo, token)) {
        sessionStorage.setItem("codev2e_gh_owner", owner);
        sessionStorage.setItem("codev2e_gh_repo", repo);
        sessionStorage.setItem("codev2e_gh_token", token);
      } else {
        document.getElementById("authStatus").textContent = "Connection failed. Check Token and Repo.";
      }
    };

    async function loadRepo(owner, repo, token) {
      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
        });
        const data = await res.json();
        fileSha = data.sha;
        state = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
        
        document.getElementById("authView").style.display = "none";
        document.getElementById("dashView").style.display = "block";

        if (state.heroWidget) {
          document.getElementById("hwTitle").value = state.heroWidget.title || "";
          document.getElementById("hwDesc").value = state.heroWidget.description || "";
          document.getElementById("hwImg").value = state.heroWidget.image || "";
        }
        renderAll();
        return true;
      } catch (err) { return false; }
    }

    // Tabs
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).style.display = "block";
      };
    });

    // Upload Helper
    async function uploadFile(file, callback) {
      if (!file) return;
      const owner = sessionStorage.getItem("codev2e_gh_owner");
      const repo = sessionStorage.getItem("codev2e_gh_repo");
      const token = sessionStorage.getItem("codev2e_gh_token");
      
      const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, "").toLowerCase();
      const filePath = `images/${Date.now()}-${cleanName}`;
      
      const reader = new FileReader();
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
          body: JSON.stringify({ message: `Upload ${filePath}`, content: base64Data })
        });
        if (res.ok) {
          alert("✓ Uploaded! Click 'PUBLISH' when done.");
          callback(filePath);
          renderAll();
        } else alert("Upload error.");
      };
      reader.readAsDataURL(file);
    }

    function renderAll() {
      // 1. Projects
      document.getElementById("projList").innerHTML = (state.projects || []).map((p, i) => `
        <div class="card-item">
          <input type="text" value="${p.title}" oninput="state.projects[${i}].title=this.value" placeholder="Title">
          <select onchange="state.projects[${i}].status=this.value">
            <option value="RELEASED" ${p.status==='RELEASED'?'selected':''}>RELEASED</option>
            <option value="UPCOMING" ${p.status==='UPCOMING'?'selected':''}>UPCOMING</option>
          </select>
          <input type="text" value="${p.image}" oninput="state.projects[${i}].image=this.value" placeholder="Poster URL">
          <textarea rows="2" oninput="state.projects[${i}].description=this.value">${p.description}</textarea>
          <button class="btn btn-danger" onclick="state.projects.splice(${i},1); renderAll();">DELETE</button>
        </div>
      `).join("");

      // 2. Characters
      document.getElementById("charList").innerHTML = (state.characters || []).map((c, i) => `
        <div class="card-item">
          <div style="display:flex; gap:10px;">
            <input type="text" value="${c.name}" oninput="state.characters[${i}].name=this.value" placeholder="Name">
            <input type="text" value="${c.role}" oninput="state.characters[${i}].role=this.value" placeholder="Role">
          </div>
          <input type="text" value="${c.image}" oninput="state.characters[${i}].image=this.value" placeholder="Artwork Path">
          <input type="file" id="cf-${i}" style="display:none;" onchange="uploadFile(this.files[0], p => state.characters[${i}].image=p)">
          <button class="btn btn-outline" style="margin-bottom:8px;" onclick="document.getElementById('cf-${i}').click()">⬆ UPLOAD ARTWORK</button>
          <textarea rows="2" oninput="state.characters[${i}].description=this.value">${c.description}</textarea>
        </div>
      `).join("");

      // 3. Products
      document.getElementById("prodList").innerHTML = (state.products || []).map((pr, i) => `
        <div class="card-item">
          <input type="text" value="${pr.title}" oninput="state.products[${i}].title=this.value" placeholder="Product Name">
          <input type="text" value="${pr.price}" oninput="state.products[${i}].price=this.value" placeholder="Price (e.g. $38.00)">
          <input type="text" value="${pr.image}" oninput="state.products[${i}].image=this.value" placeholder="Product Image">
          <textarea rows="2" oninput="state.products[${i}].description=this.value">${pr.description}</textarea>
          <button class="btn btn-danger" onclick="state.products.splice(${i},1); renderAll();">DELETE PRODUCT</button>
        </div>
      `).join("");

      // 4. News
      document.getElementById("newsList").innerHTML = (state.announcements || []).map((a, i) => `
        <div class="card-item">
          <input type="text" value="${a.title}" oninput="state.announcements[${i}].title=this.value" placeholder="Headline">
          <textarea rows="2" oninput="state.announcements[${i}].content=this.value">${a.content}</textarea>
          <button class="btn btn-danger" onclick="state.announcements.splice(${i},1); renderAll();">DELETE</button>
        </div>
      `).join("");
    }

    document.getElementById("addProjBtn").onclick = () => {
      state.projects.unshift({ id: Date.now(), title: "NEW PROJECT", status: "RELEASED", year: "2026", genre: "Animation", description: "", image: "images/logo.png" });
      renderAll();
    };

    document.getElementById("addProdBtn").onclick = () => {
      state.products.unshift({ id: "p" + Date.now(), title: "NEW PRODUCT", price: "$25.00", category: "MERCH", image: "images/logo.png", description: "" });
      renderAll();
    };

    document.getElementById("addNewsBtn").onclick = () => {
      state.announcements.unshift({ id: Date.now().toString(), title: "DISPATCH", category: "NEWS", date: new Date().toISOString().split("T")[0], content: "" });
      renderAll();
    };

    document.getElementById("saveBtn").onclick = async () => {
      const btn = document.getElementById("saveBtn");
      btn.textContent = "COMMITTING...";
      const owner = sessionStorage.getItem("codev2e_gh_owner");
      const repo = sessionStorage.getItem("codev2e_gh_repo");
      const token = sessionStorage.getItem("codev2e_gh_token");
      
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))));
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify({ message: `Studio update [${new Date().toISOString()}]`, content, sha: fileSha })
      });
      if (res.ok) {
        const d = await res.json();
        fileSha = d.content.sha;
        alert("✓ Published live successfully!");
      } else alert("Error publishing changes.");
      btn.textContent = "PUBLISH TO LIVE SITE";
    };

    init();
  </script>
</body>
</html>
