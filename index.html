<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CODEV2E Admin</title>
<style>
:root{color-scheme:dark;--bg:#070707;--panel:#101010;--line:#252525;--text:#f5f5f5;--muted:#888;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:20px}
.brand{font-weight:950;letter-spacing:.16em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.panel{background:var(--panel);border:1px solid var(--line);padding:20px}.panel h2{margin:0 0 16px;font-size:15px;letter-spacing:.08em}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#aaa;margin:14px 0 7px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#080808;color:#fff;padding:12px;border-radius:8px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#777}textarea{min-height:120px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.btn{border:1px solid var(--line);background:#181818;color:#fff;padding:11px 14px;border-radius:8px;font-weight:800}
.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.danger{border-color:#552020;color:#ff8d8d}
.hidden{display:none!important}.notice{margin:15px 0;padding:11px 13px;border:1px solid var(--line);border-radius:8px;color:#bbb}
.cards{display:grid;gap:10px}.card{border:1px solid var(--line);padding:14px;border-radius:9px;background:#0b0b0b}
.cardhead{display:flex;justify-content:space-between;gap:10px}.tag{font-size:10px;letter-spacing:.1em;color:#aaa}
.small{font-size:12px}.login{max-width:420px;margin:12vh auto}.login h1{font-size:32px;letter-spacing:-.04em}
@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:18px 14px 45px}}
</style>
</head>
<body>
<div id="login" class="wrap login">
  <div class="panel">
    <div class="muted">CODEV2E · PRIVATE AREA</div>
    <h1>ADMIN LOGIN.</h1>
    <p class="muted">This area is protected by the server. Your password is never stored in this page.</p>
    <form id="loginForm">
      <label for="password">ADMIN PASSWORD</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="btn primary" type="submit">SIGN IN</button></div>
      <div id="loginMsg" class="notice hidden"></div>
    </form>
  </div>
</div>

<div id="app" class="wrap hidden">
  <div class="top">
    <div><div class="brand">CODEV2E ADMIN</div><div class="muted small">Cloudflare D1 control panel</div></div>
    <button id="logout" class="btn">LOG OUT</button>
  </div>

  <div id="msg" class="notice hidden"></div>

  <div class="grid">
    <section class="panel">
      <h2>PROJECT EDITOR</h2>
      <form id="projectForm">
        <input id="projectId" type="hidden">
        <label>TITLE</label><input id="title" maxlength="120" required>
        <label>STATUS</label>
        <select id="status"><option>RELEASED</option><option>UPCOMING</option></select>
        <label>YEAR</label><input id="year" maxlength="20" placeholder="2026">
        <label>GENRE</label><input id="genre" maxlength="80" placeholder="Animation">
        <label>IMAGE URL / PATH</label><input id="image" maxlength="500" placeholder="/assets/project.png">
        <label>PROJECT PAGE URL</label><input id="pageUrl" maxlength="500" placeholder="/pj1.html">
        <label>DESCRIPTION</label><textarea id="description" maxlength="3000"></textarea>
        <div class="actions">
          <button class="btn primary" type="submit">SAVE PROJECT</button>
          <button id="clearProject" class="btn" type="button">NEW</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>PROJECTS</h2>
      <div id="projects" class="cards"></div>
    </section>

    <section class="panel">
      <h2>ANNOUNCEMENT</h2>
      <form id="announcementForm">
        <input id="announcementId" type="hidden">
        <label>TITLE</label><input id="aTitle" maxlength="160" required>
        <label>CATEGORY</label><input id="aCategory" maxlength="50" value="ANNOUNCEMENT">
        <label>PUBLISH DATE</label><input id="aDate" type="datetime-local" required>
        <label>BODY</label><textarea id="aBody" maxlength="5000" required></textarea>
        <div class="actions">
          <button class="btn primary" type="submit">SAVE ANNOUNCEMENT</button>
          <button id="clearAnnouncement" class="btn" type="button">NEW</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>ANNOUNCEMENTS</h2>
      <div id="announcements" class="cards"></div>
    </section>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
async function api(url, options={}) {
  const res=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
  let data={}; try{data=await res.json()}catch{}
  if(!res.ok) throw new Error(data.error||"Request failed");
  return data;
}
function message(text, ok=true, target=$("msg")){
  target.textContent=text;target.classList.remove("hidden");
  target.style.borderColor=ok?"#2a2a2a":"#552020";
  target.style.color=ok?"#bbb":"#ff8d8d";
}
async function checkSession(){
  try{await api("/api/auth/me"); $("login").classList.add("hidden");$("app").classList.remove("hidden");loadAll()}
  catch{$("login").classList.remove("hidden");$("app").classList.add("hidden")}
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({password:$("password").value})});
      $("password").value="";await checkSession()}
  catch(err){message(err.message,false,$("loginMsg"))}
});
$("logout").onclick=async()=>{try{await api("/api/auth/logout",{method:"POST"})}finally{location.reload()}};

function clearProject(){ $("projectId").value="";["title","year","genre","image","pageUrl","description"].forEach(x=>$(x).value="");$("status").value="UPCOMING" }
$("clearProject").onclick=clearProject;
$("projectForm").onsubmit=async e=>{
  e.preventDefault();
  const id=$("projectId").value;
  const payload={title:$("title").value,status:$("status").value,year:$("year").value,genre:$("genre").value,image:$("image").value,page_url:$("pageUrl").value,description:$("description").value};
  try{await api(id?"/api/admin/projects/"+encodeURIComponent(id):"/api/admin/projects",{method:id?"PUT":"POST",body:JSON.stringify(payload)});
      message("Project saved.");clearProject();loadProjects()}catch(err){message(err.message,false)}
};
let projectCache=[], announcementCache=[];
async function loadProjects(){
  const {projects}=await api("/api/projects");
  projectCache=projects||[];
  $("projects").innerHTML=projectCache.length?projectCache.map(p=>`<div class="card">
    <div class="cardhead"><strong>${escapeHtml(p.title)}</strong><span class="tag">${escapeHtml(p.status)}</span></div>
    <div class="muted small">${escapeHtml(p.genre||"")} · ${escapeHtml(p.year||"")}</div>
    <div class="actions"><button class="btn" data-edit-project="${Number(p.id)}">EDIT</button><button class="btn danger" data-delete-project="${Number(p.id)}">DELETE</button></div>
  </div>`).join(""):'<div class="muted">No projects yet.</div>';
}
function editProject(p){
  $("projectId").value=p.id;$("title").value=p.title||"";$("status").value=p.status||"UPCOMING";
  $("year").value=p.year||"";$("genre").value=p.genre||"";$("image").value=p.image||"";
  $("pageUrl").value=p.page_url||"";$("description").value=p.description||"";
  window.scrollTo({top:0,behavior:"smooth"});
}
async function deleteProject(id){
  if(!confirm("Delete this project?"))return;
  try{await api("/api/admin/projects/"+encodeURIComponent(id),{method:"DELETE"});message("Project deleted.");loadProjects()}
  catch(e){message(e.message,false)}
}

function clearAnnouncement(){
  $("announcementId").value="";$("aTitle").value="";$("aCategory").value="ANNOUNCEMENT";$("aBody").value="";
  $("aDate").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)
}
$("clearAnnouncement").onclick=clearAnnouncement;
$("announcementForm").onsubmit=async e=>{
  e.preventDefault();const id=$("announcementId").value;
  const payload={title:$("aTitle").value,category:$("aCategory").value,published_at:new Date($("aDate").value).toISOString(),body:$("aBody").value};
  try{await api(id?"/api/admin/announcements/"+encodeURIComponent(id):"/api/admin/announcements",{method:id?"PUT":"POST",body:JSON.stringify(payload)});
      message("Announcement saved.");clearAnnouncement();loadAnnouncements()}
  catch(err){message(err.message,false)}
};
async function loadAnnouncements(){
  const {announcements}=await api("/api/announcements");
  announcementCache=announcements||[];
  $("announcements").innerHTML=announcementCache.length?announcementCache.map(a=>`<div class="card">
    <div class="cardhead"><strong>${escapeHtml(a.title)}</strong><span class="tag">${escapeHtml(a.category||"")}</span></div>
    <div class="muted small">${new Date(a.published_at).toLocaleString("en-IN")}</div>
    <p class="small">${escapeHtml(a.body||"").slice(0,220)}</p>
    <div class="actions"><button class="btn" data-edit-announcement="${Number(a.id)}">EDIT</button><button class="btn danger" data-delete-announcement="${Number(a.id)}">DELETE</button></div>
  </div>`).join(""):'<div class="muted">No current announcements.</div>';
}
function editAnnouncement(a){
  $("announcementId").value=a.id;$("aTitle").value=a.title||"";$("aCategory").value=a.category||"ANNOUNCEMENT";
  $("aDate").value=new Date(a.published_at).toISOString().slice(0,16);$("aBody").value=a.body||"";
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
async function deleteAnnouncement(id){
  if(!confirm("Delete this announcement?"))return;
  try{await api("/api/admin/announcements/"+encodeURIComponent(id),{method:"DELETE"});message("Announcement deleted.");loadAnnouncements()}
  catch(e){message(e.message,false)}
}
$("projects").addEventListener("click",e=>{
  const edit=e.target.closest("[data-edit-project]"), del=e.target.closest("[data-delete-project]");
  if(edit){const p=projectCache.find(x=>Number(x.id)===Number(edit.dataset.editProject));if(p)editProject(p)}
  if(del)deleteProject(del.dataset.deleteProject);
});
$("announcements").addEventListener("click",e=>{
  const edit=e.target.closest("[data-edit-announcement]"), del=e.target.closest("[data-delete-announcement]");
  if(edit){const a=announcementCache.find(x=>Number(x.id)===Number(edit.dataset.editAnnouncement));if(a)editAnnouncement(a)}
  if(del)deleteAnnouncement(del.dataset.deleteAnnouncement);
});
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function loadAll(){await Promise.all([loadProjects(),loadAnnouncements()]);clearAnnouncement()}
async function loadAll(){await Promise.all([loadProjects(),loadAnnouncements()]);clearAnnouncement()}
checkSession();
</script>
</body></html>
